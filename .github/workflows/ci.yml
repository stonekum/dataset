name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

      - name: Streamlit page smoke tests
        run: |
          python -c "
          from streamlit.testing.v1 import AppTest
          import sys
          failed = []
          for p in ['app.py', 'pages/1_📊_运营视图.py', 'pages/2_📈_汇报视图.py', 'pages/3_📤_数据导入.py']:
              at = AppTest.from_file(p, default_timeout=30).run()
              if at.exception:
                  failed.append((p, str(at.exception)))
                  print(f'❌ {p}: {at.exception}')
              else:
                  print(f'✅ {p}')
          sys.exit(1 if failed else 0)
          "
